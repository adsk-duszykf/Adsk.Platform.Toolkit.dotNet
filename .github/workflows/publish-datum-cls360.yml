name: Publish Autodesk.Datum.CLS360

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Optional git ref to publish from (for example rc/datum-cls360/v1.0.0)'
        required: false
        default: ''
        type: string
      force_publish:
        description: 'Skip changelog-change check'
        required: false
        default: false
        type: boolean

jobs:
  publish:
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/_publish-nuget-package.yml
    with:
      folder: Autodesk.Datum.CLS360
      csproj: Autodesk.Datum.CLS360/Autodesk.Datum.CLS360.csproj
      package_id: Adsk.Platform.Datum.CLS360
      source_ref: ${{ inputs.source_ref }}
      force_publish: ${{ inputs.force_publish == true }}
    secrets:
      nuget_user: ${{ secrets.NUGET_USER }}