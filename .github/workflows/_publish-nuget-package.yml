# Reusable workflow - shared publish logic for all NuGet packages.
# Called by per-project workflows; not triggered directly.
name: _Publish NuGet Package (shared)

on:
  workflow_call:
    inputs:
      folder:
        description: "Project folder name (relative to repo root, e.g. Autodesk.Authentication)"
        required: true
        type: string
      csproj:
        description: "Path to the .csproj file relative to repo root"
        required: true
        type: string
      package_id:
        description: "NuGet package ID (e.g. Adsk.Platform.Authentication)"
        required: true
        type: string
      source_ref:
        description: "Optional git ref to publish from (tag, branch, or SHA)"
        required: false
        type: string
        default: ""
      force_publish:
        description: "Skip the changelog-change check and publish if versions match"
        required: false
        type: boolean
        default: false
    secrets:
      nuget_user:
        description: "NuGet.org profile name"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout (default ref)
        if: inputs.source_ref == ''
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout (custom ref)
        if: inputs.source_ref != ''
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Derive package slug
        id: slug
        run: |
          SLUG=$(printf '%s' "${{ inputs.package_id }}" | sed 's/^Adsk\.Platform\.//' | tr '[:upper:]' '[:lower:]' | tr '.' '-')
          echo "slug=$SLUG" >> $GITHUB_OUTPUT

      - name: Check CHANGELOG.md exists
        run: |
          if [ ! -f "${{ inputs.folder }}/CHANGELOG.md" ]; then
            echo "FAIL - no CHANGELOG.md found in ${{ inputs.folder }}/"
            exit 1
          fi
          echo "Found ${{ inputs.folder }}/CHANGELOG.md"

      - name: Check CHANGELOG.md was modified
        if: inputs.force_publish == false
        run: |
          SLUG="${{ steps.slug.outputs.slug }}"
          PREV_TAG=$(git describe --abbrev=0 --tags --match "$SLUG/v*" HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            DIFF_BASE=$(git rev-list --max-parents=0 HEAD)
            echo "No previous tag for $SLUG - comparing against initial commit ($DIFF_BASE)"
          else
            DIFF_BASE="$PREV_TAG"
            echo "Comparing against previous tag: $PREV_TAG"
          fi

          CHANGED=$(git diff --name-only "$DIFF_BASE" HEAD -- "${{ inputs.folder }}/CHANGELOG.md")
          if [ -z "$CHANGED" ]; then
            echo "FAIL - CHANGELOG.md not modified since $DIFF_BASE"
            exit 1
          fi
          echo "CHANGELOG.md was modified"

      - name: Compare versions
        id: versions
        run: |
          CHANGELOG_VERSION=$(grep -m1 '## \[' "${{ inputs.folder }}/CHANGELOG.md" \
            | sed 's/.*\[\([^]]*\)\].*/\1/')
          CSPROJ_VERSION=$(grep -m1 '<Version>' "${{ inputs.csproj }}" \
            | sed 's/.*<Version>[[:space:]]*\(.*\)[[:space:]]*<\/Version>.*/\1/' | xargs)

          echo "Changelog version : ${CHANGELOG_VERSION:-(not found)}"
          echo ".csproj version   : ${CSPROJ_VERSION:-(not found)}"

          if [ -z "$CHANGELOG_VERSION" ] || [ -z "$CSPROJ_VERSION" ]; then
            echo "FAIL - could not parse one or both versions"
            exit 1
          elif [ "$CHANGELOG_VERSION" != "$CSPROJ_VERSION" ]; then
            echo "FAIL - version mismatch (changelog=$CHANGELOG_VERSION, csproj=$CSPROJ_VERSION)"
            exit 1
          fi
          echo "version=$CSPROJ_VERSION" >> $GITHUB_OUTPUT
          echo "All gates passed - will publish ${{ inputs.package_id }} v$CSPROJ_VERSION"

      - name: Restore and Build
        run: |
          dotnet restore "${{ inputs.csproj }}"
          dotnet build "${{ inputs.csproj }}" \
            --configuration Release \
            --no-restore \
            /p:Version="${{ steps.versions.outputs.version }}"

      - name: Pack
        run: |
          dotnet pack "${{ inputs.csproj }}" \
            --configuration Release \
            --no-build \
            /p:Version="${{ steps.versions.outputs.version }}" \
            --output ./nupkg

      - name: NuGet login (OIDC → temp API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.nuget_user }}

      - name: Publish to NuGet
        run: |
          dotnet nuget push \
            "./nupkg/${{ inputs.package_id }}.${{ steps.versions.outputs.version }}.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate
          echo "Published ${{ inputs.package_id }} v${{ steps.versions.outputs.version }}"

      - name: Create and push release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SLUG="${{ steps.slug.outputs.slug }}"
          VERSION="${{ steps.versions.outputs.version }}"
          TAG="$SLUG/v$VERSION"

          git fetch --tags
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "FAIL - tag $TAG already exists"
            exit 1
          fi

          git tag -a "$TAG" -m "Release ${{ inputs.package_id }} v$VERSION"
          git push origin "$TAG"
          echo "Created tag $TAG"
