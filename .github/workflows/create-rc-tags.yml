name: Create Release Candidate Tags

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Optional git ref to create RC tags from (branch, tag, or SHA)"
        required: false
        default: ""
        type: string
      force_tag:
        description: "Bypass changelog-changed check (manual runs only)"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  create_rc_tags:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref != '' && inputs.source_ref || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Create project rc tags
        run: |
          set -uo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          BEFORE_SHA="${{ github.event.before }}"
          FORCE_TAG="${{ github.event_name == 'workflow_dispatch' && inputs.force_tag == true }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DIFF_BASE=$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
            echo "Manual run - using previous commit as diff base when available: $DIFF_BASE"
          elif [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            DIFF_BASE=$(git rev-list --max-parents=0 HEAD)
            echo "Using initial commit as diff base: $DIFF_BASE"
          else
            DIFF_BASE="$BEFORE_SHA"
            echo "Using push before SHA as diff base: $DIFF_BASE"
          fi

          CREATED=()
          SKIPPED=()

          while IFS= read -r -d '' CHANGELOG; do
            FOLDER=$(dirname "$CHANGELOG")
            CSPROJ=$(find "$FOLDER" -maxdepth 1 -type f -name '*.csproj' -print -quit)
            if [ -z "$CSPROJ" ]; then
              SKIPPED+=("$FOLDER (no .csproj)")
              continue
            fi

            PACKAGE_ID=$(grep -m1 '<PackageId>' "$CSPROJ" \
              | sed 's/.*<PackageId>[[:space:]]*\(.*\)[[:space:]]*<\/PackageId>.*/\1/' | xargs)
            if [ -z "$PACKAGE_ID" ]; then
              SKIPPED+=("$FOLDER (no PackageId)")
              continue
            fi
            SLUG=$(printf '%s' "$PACKAGE_ID" | sed 's/^Adsk\.Platform\.//' | tr '[:upper:]' '[:lower:]' | tr '.' '-')

            CHANGED=$(git diff --name-only "$DIFF_BASE" HEAD -- "$CHANGELOG")
            if [ -z "$CHANGED" ] && [ "$FORCE_TAG" != "true" ]; then
              SKIPPED+=("$SLUG (changelog unchanged)")
              continue
            elif [ -z "$CHANGED" ] && [ "$FORCE_TAG" = "true" ]; then
              echo "force_tag=true - bypassing changelog check for $SLUG"
            fi

            CHANGELOG_VERSION=$(grep -m1 '## \[' "$CHANGELOG" | sed 's/.*\[\([^]]*\)\].*/\1/')
            CSPROJ_VERSION=$(grep -m1 '<Version>' "$CSPROJ" \
              | sed 's/.*<Version>[[:space:]]*\(.*\)[[:space:]]*<\/Version>.*/\1/' | xargs)

            if [ -z "$CHANGELOG_VERSION" ] || [ -z "$CSPROJ_VERSION" ] || [ "$CHANGELOG_VERSION" != "$CSPROJ_VERSION" ]; then
              SKIPPED+=("$SLUG (version mismatch or parse error)")
              continue
            fi

            echo "Building $SLUG v$CSPROJ_VERSION"
            if ! dotnet restore "$CSPROJ" || \
              ! dotnet build "$CSPROJ" --configuration Release --no-restore /p:Version="$CSPROJ_VERSION"; then
              SKIPPED+=("$SLUG (build failed)")
              echo "Build failed for $SLUG; no RC tag will be created"
              continue
            fi

            TAG="rc/$SLUG/v$CSPROJ_VERSION-$SHORT_SHA"
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              SKIPPED+=("$SLUG ($TAG exists)")
              continue
            fi

            if git tag -a "$TAG" -m "RC tag for $SLUG v$CSPROJ_VERSION" && git push origin "$TAG"; then
              CREATED+=("$TAG")
            else
              SKIPPED+=("$SLUG (failed to create or push $TAG)")
              git tag -d "$TAG" >/dev/null 2>&1 || true
            fi
          done < <(find . -mindepth 2 -maxdepth 2 -type f -name 'CHANGELOG.md' -print0 | sort -z)

          echo "Created tags: ${#CREATED[@]}"
          for t in "${CREATED[@]}"; do echo "+ $t"; done
          echo "Skipped: ${#SKIPPED[@]}"
          for s in "${SKIPPED[@]}"; do echo "- $s"; done
