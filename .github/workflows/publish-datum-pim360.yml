name: Publish Autodesk.Datum.PIM360

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Optional git ref to publish from (for example rc/datum-pim360/v1.0.0)'
        required: false
        default: ''
        type: string
      force_publish:
        description: 'Skip changelog-change check'
        required: false
        default: false
        type: boolean

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_publish-nuget-package.yml
    with:
      folder: Autodesk.Datum.PIM360
      csproj: Autodesk.Datum.PIM360/Autodesk.Datum.PIM360.csproj
      package_id: Adsk.Platform.Datum.PIM360
      source_ref: ${{ inputs.source_ref }}
      force_publish: ${{ inputs.force_publish == true }}
      use_oidc: true
    secrets:
      nuget_api_key: ${{ secrets.NUGET_API_KEY }}
      nuget_user: ${{ secrets.NUGET_USER }}
